name: cJSON qualification candidate

on:
  push:
    branches:
      - main
      - qualification/**
    tags:
      - '[0-9]*.[0-9]*.[0-9]*-[0-9]*.[0-9]*.[0-9]*'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  qualification-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact source and submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install hash-locked Python tools
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Install documentation renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq default-jre-headless plantuml

      - name: Verify locked Python dependencies
        run: python -m pip check

      - name: Verify documented native candidate deviations
        run: |
          set +e
          ./build-and-test.sh all
          NATIVE_RC=$?
          set -e
          test "${NATIVE_RC}" -eq 1

      - name: Run runner regression and fault-seed tests
        if: always() && !cancelled()
        run: python -m pytest -q

      - name: Build warning-as-error documentation
        if: always() && !cancelled()
        run: |
          python -m sphinx -b html -W . _build/html
          test -s _build/html/index.html
          test -s _build/html/needs.json

      - name: Generate blocked qualification evidence report
        if: always() && !cancelled()
        run: |
          SOURCE_REVISION="$(git rev-parse HEAD:cjson-source)"
          CONFIGURATION_SHA256="$(python -c 'import runpy; print(runpy.run_path("tools/qualification.py")["configuration_sha256"]())')"
          set +e
          osqar framework validate \
            --project osqar_project.json \
            --profile qualification \
            --source-revision "${SOURCE_REVISION}" \
            --configuration-sha256 "${CONFIGURATION_SHA256}" \
            --report-json _build/evidence/framework-validation.json
          FRAMEWORK_RC=$?
          set -e
          test "${FRAMEWORK_RC}" -eq 1

      - name: Generate blocked directed qualification traceability report
        if: always() && !cancelled()
        run: |
          SOURCE_REVISION="$(git rev-parse HEAD:cjson-source)"
          CONFIGURATION_SHA256="$(python -c 'import runpy; print(runpy.run_path("tools/qualification.py")["configuration_sha256"]())')"
          set +e
          osqar traceability _build/html/needs.json \
            --project-config osqar_project.json \
            --profile qualification \
            --evidence-project osqar_project.json \
            --source-revision "${SOURCE_REVISION}" \
            --configuration-sha256 "${CONFIGURATION_SHA256}" \
            --test-prefix VER_ \
            --code-prefix IMPL_ \
            --json-report _build/evidence/traceability-qualification-v1.json
          TRACEABILITY_RC=$?
          set -e
          test "${TRACEABILITY_RC}" -eq 1

      - name: Accept candidate integration policy (qualification remains blocked)
        if: always() && !cancelled()
        run: |
          python tools/verify_candidate_integration.py \
            --root . \
            --policy assurance/candidate-integration-policy.json \
            --framework-report _build/evidence/framework-validation.json \
            --traceability-report _build/evidence/traceability-qualification-v1.json

      - name: Upload candidate evidence for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-candidate-${{ github.sha }}
          path: |
            _build/evidence/
            _build/html/needs.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload exact-tag documentation for Pages
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: sphinx-html-${{ github.sha }}
          path: _build/html/
          if-no-files-found: error
          retention-days: 30

      - name: Prepare pre-integration development release bundle
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          rm -rf _shipment _build/release
          mkdir -p _build/release
          python tools/prepare_development_release.py \
            --root . \
            --output _shipment/osqar-cjson-development-bundle \
            --docs _build/html \
            --evidence _build/evidence \
            --release-version "${RELEASE_VERSION}" \
            --release-revision "${RELEASE_REVISION}"
          SOURCE_REVISION="$(git rev-parse HEAD:cjson-source)"
          osqar release-manifest generate \
            --root _shipment/osqar-cjson-development-bundle \
            --output _shipment/osqar-cjson-development-bundle/OSQAR-RELEASE-MANIFEST.json \
            --source-revision "${SOURCE_REVISION}" \
            --release-version v0.10.2 \
            --producer-command "GitHub Actions ${GITHUB_WORKFLOW} ${GITHUB_RUN_ID}" \
            --tool-version 0.10.2 \
            --exclude documentation/_static/scripts/furo-extensions.js \
            --exclude evidence/warnings/cJSON.txt \
            --exclude evidence/warnings/cJSON_Utils.txt
          osqar release-manifest verify \
            --root _shipment/osqar-cjson-development-bundle \
            --manifest _shipment/osqar-cjson-development-bundle/OSQAR-RELEASE-MANIFEST.json \
            --source-revision "${SOURCE_REVISION}" \
            --release-version v0.10.2 \
            --report-json _build/release/manifest-verification.json
          ARCHIVE="osqar_cjson_development_bundle_${RELEASE_VERSION}.zip"
          osqar shipment package \
            --shipment _shipment/osqar-cjson-development-bundle \
            --output "_build/release/${ARCHIVE}"
          (
            cd _build/release
            sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
          )

      - name: Upload development release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: development-release-${{ github.sha }}
          path: |
            _build/release/osqar_cjson_development_bundle_${{ github.ref_name }}.zip
            _build/release/osqar_cjson_development_bundle_${{ github.ref_name }}.zip.sha256
          if-no-files-found: error
          retention-days: 90

  release-development-bundle:
    needs: qualification-candidate
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download exact-tag release assets
        uses: actions/download-artifact@v4
        with:
          name: development-release-${{ github.sha }}
          path: dist

      - name: Publish explicitly non-qualified development prerelease
        uses: softprops/action-gh-release@v2
        with:
          name: "OSQAr-cJSON ${{ github.ref_name }} — pre-integration development release"
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          generate_release_notes: false
          body: |
            ## Pre-integration development release — qualification remains BLOCKED

            This bundle publishes the current qualification work in progress for
            development and pre-integration use. It is **not** a qualified component
            package, certification, ISO 26262 compliance statement, ASIL allocation,
            or claim that cJSON is suitable for an automotive item.

            The tagged policy and bundled evidence preserve the exact known blocked
            outcome: complexity finding QF-01, static-analysis finding QF-02,
            unapproved qualification evidence, and the documented outstanding
            verification activities remain open. Green CI confirms reproduction of
            that bounded state; it does not change the qualification decision.

            The ZIP contains the exact tagged repository sources, the pinned cJSON
            source tree, rendered documentation, generated evidence, a development-
            release status record, and an OSQAr release manifest with the documented
            zero-length-file exclusions. Verify the complete downloaded ZIP with its
            adjacent `.sha256` file before use.
          files: |
            dist/osqar_cjson_development_bundle_${{ github.ref_name }}.zip
            dist/osqar_cjson_development_bundle_${{ github.ref_name }}.zip.sha256

  pages:
    needs: qualification-candidate
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Download exact-tag Sphinx HTML
        uses: actions/download-artifact@v4
        with:
          name: sphinx-html-${{ github.sha }}
          path: _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy exact-tag documentation to GitHub Pages
        uses: actions/deploy-pages@v4
