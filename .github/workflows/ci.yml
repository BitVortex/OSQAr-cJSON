name: cJSON Qualification CI

on:
  push:
    branches: [main]
    tags:
      - '[0-9]*.[0-9]*.[0-9]*-[0-9]*.[0-9]*.[0-9]*'
  pull_request:
    branches: [main]

permissions:
  contents: write   # required for creating GitHub Releases on tag

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install tool dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cppcheck gcovr lcov default-jre-headless plantuml
          python3 -m pip install --upgrade pip
          python3 -m pip install lizard coverage
          python3 -m pip install -r requirements-docs.txt

      - name: Install OSQAr CLI (pinned)
        run: python3 -m pip install osqar==0.7.0

      - name: Build and test cJSON (qualification pipeline)
        run: |
          chmod +x build-and-test.sh
          ./build-and-test.sh all
          echo "=== Evidence artifacts ==="
          ls -la test_results.xml coverage_report.txt complexity_report.txt 2>/dev/null || true
          ls -la _build/evidence/ 2>/dev/null || true

      - name: Build Sphinx documentation
        run: |
          python3 -m sphinx -b html -W . _build/html
          echo "=== Sphinx build OK ==="
          test -f _build/html/index.html
          test -f _build/html/needs.json

      - name: Upload Sphinx HTML artifact (for Pages)
        uses: actions/upload-artifact@v4
        with:
          name: sphinx-html
          path: _build/html/
          retention-days: 7

      - name: Run OSQAr doctor
        run: |
          osqar doctor --project . --traceability --needs-json _build/html/needs.json
        continue-on-error: true

      - name: Traceability check (custom prefixes)
        run: |
          osqar traceability _build/html/needs.json \
            --test-prefix VER_ --code-prefix IMPL_ \
            --json-report _build/html/traceability_report.json

      - name: Assemble shipment
        run: |
          set -euo pipefail
          SHIP_ROOT="_shipment"
          rm -rf "${SHIP_ROOT}"
          mkdir -p "${SHIP_ROOT}/docs" "${SHIP_ROOT}/implementation" \
                   "${SHIP_ROOT}/tests" "${SHIP_ROOT}/reports" \
                   "${SHIP_ROOT}/verification"

          # Documentation (Sphinx HTML build)
          cp -a _build/html/. "${SHIP_ROOT}/docs/"

          # Source code (qualification baseline)
          cp cjson-source/cJSON.c cjson-source/cJSON.h \
             cjson-source/cJSON_Utils.c cjson-source/cJSON_Utils.h \
             "${SHIP_ROOT}/implementation/" 2>/dev/null || true
          cp cjson-source/CMakeLists.txt cjson-source/Makefile \
             "${SHIP_ROOT}/implementation/" 2>/dev/null || true

          # Build descriptor
          cp osqar_project.json build-and-test.sh "${SHIP_ROOT}/implementation/" 2>/dev/null || true

          # Test suite
          if [ -d cjson-source/tests ]; then
            cp -a cjson-source/tests/. "${SHIP_ROOT}/tests/" 2>/dev/null || true
          fi

          # Reports (generated by build-and-test.sh)
          for f in test_results.xml coverage_report.txt complexity_report.txt; do
            if [ -f "$f" ]; then
              cp "$f" "${SHIP_ROOT}/reports/"
            fi
          done

          # Verification evidence (sanitizer logs, cppcheck, warn audit)
          if [ -d _build/evidence ]; then
            cp -a _build/evidence/. "${SHIP_ROOT}/verification/" 2>/dev/null || true
          fi

          echo "=== Shipment assembled ==="
          find "${SHIP_ROOT}" -type f | wc -l
          echo "files"

      - name: Generate checksums
        run: |
          osqar checksum generate \
            --root _shipment \
            --output _shipment/SHA256SUMS
          osqar checksum verify \
            --root _shipment \
            --manifest _shipment/SHA256SUMS

      - name: Package shipment archive
        run: |
          rm -f osqar_cjson_shipment.zip osqar_cjson_shipment.zip.sha256
          osqar shipment package --shipment _shipment --output osqar_cjson_shipment.zip
          sha256sum osqar_cjson_shipment.zip > osqar_cjson_shipment.zip.sha256
          echo "Shipment package: $(du -h osqar_cjson_shipment.zip | cut -f1)"

      - name: Upload shipment artifact
        uses: actions/upload-artifact@v4
        with:
          name: cjson-qualification-shipment
          path: |
            osqar_cjson_shipment.zip
            osqar_cjson_shipment.zip.sha256
          retention-days: 90

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          name: "cJSON Qualification ${{ github.ref_name }}"
          body: |
            ## cJSON ${{ github.ref_name }} — ISO 26262 ASIL D SEooC Qualification

            Qualified using [OSQAr](https://github.com/BitVortex/OSQAr) v0.7.0.

            **Shipment contents:**
            - Sphinx HTML documentation with full traceability (requirements ↔ architecture ↔ verification)
            - `needs.json` machine-readable traceability export
            - `traceability_report.json` verification report (zero violations)
            - `SHA256SUMS` integrity manifest
            - cJSON source files (qualification baseline)
            - Test results (JUnit XML), coverage report, complexity analysis
            - Sanitizer logs (ASan+UBSan), compiler warning audit

            **Verification status:**
            | Activity | Status |
            |---|---|
            | Test suite | **162 Unity tests**, 0 failures |
            | ASan+UBSan | CLEAN |
            | Compiler warnings | ZERO (`-Werror`) |
            | Statement coverage | **88.1%** (1788/2029 lines) |
            | Function coverage | **98.7%** (149/151 functions) |
            | Static analysis | cppcheck XML in shipment |
            | Traceability | ZERO violations |

            Coverage measured via lcov/gcov with `--coverage` instrumentation across 18 core + 3 utils test executables. Complexity analyzed with lizard. Raw reports in `verification/` and `reports/` in the shipment ZIP.

            See [OSQAr-cJSON README](https://github.com/BitVortex/OSQAr-cJSON#readme) and [documentation](https://bitvortex.github.io/OSQAr-cJSON/) for full qualification details.
          files: |
            osqar_cjson_shipment.zip
            osqar_cjson_shipment.zip.sha256
          generate_release_notes: false

  pages:
    needs: qualify
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Download Sphinx HTML artifact
        uses: actions/download-artifact@v4
        with:
          name: sphinx-html
          path: _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
